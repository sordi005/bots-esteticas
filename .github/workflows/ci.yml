name: CI

on:
  push:

# El workflow solo lee el repo.
permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bots_esteticas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bots_esteticas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # La base del servicio arranca vacía: primero sirve para probar la migración
      # desde cero y después la reusan los tests de integración.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bots_esteticas_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bots_esteticas_test

    steps:
      # Las acciones se fijan por commit SHA, no por tag: un tag se puede mover
      # a código malicioso, un SHA no. El comentario indica la versión.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala la versión de pnpm fijada en package.json ("packageManager").
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Instala exactamente lo que dice el lockfile; si no coincide con package.json, falla.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Si alguien cambió un schema.ts y no generó la migración, falla acá.
      - name: Migraciones al día con el esquema
        run: |
          pnpm db:generate
          git add --intent-to-add migrations
          git diff --exit-code -- migrations

      - run: pnpm build

      # Con el código compilado, igual que en producción, sobre la base vacía.
      - name: Migración desde cero
        run: node dist/migrate.js
      - name: Datos de ejemplo
        run: node dist/seed.js

      - run: pnpm test:unit
      - run: pnpm test:integration
